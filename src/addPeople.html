<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpFront</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container" id="addPeopleContainer">
        <div class="fillContainer">
            <div class="left">
                <img src="./img/back.png" class="back-button" onclick="redirectToHome()">
                <div id="addPeopleTitleContainer">
                    <h2>Add people</h2>
                    <div id="addPeopleContainer">
                        <form id="addNameInput" class="personEntryContainer">
                            <input type="text" id="newPerson" class="allAddedPeople" placeholder="Enter name">
                            <img src="./img/add.png" class="add-button" onclick="addPerson()">
                        </form>
                        <div id="addedPeople"></div>
                    </div>
                </div>
            </div>
        </div>
        <button id="redirectToProcessReceiptButton" class="bottomButtons" onclick="redirectToProcessReceipt()">NEXT</button>
    </div>
    <script src="index.js"></script>
</body>

</html>
